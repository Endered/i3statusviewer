name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true

permissions:
  contents:
    write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # 6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # 1.5.12
      - run: |
             sudo apt-get update
             sudo apt-get install -y musl-dev
      - run: sbt dist
        env:
          SCALANATIVE_STATIC_LINK: yes
      - run: gh release create ${{ inputs.tag }} ./dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}